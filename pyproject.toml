# AgentAlloy — merged build config (v11.0.0 merge).
#
# Product direction: the current (v10) user experience is the framework;
# the agentalloy-v2 stack is the execution part (LM client, graph runner,
# context builder, dashboard, MCP server, LFM2.5 stack, Rust core crate).
#
# [project]  : the v10 runtime surface (fastapi/tantivy/tree-sitter/
#             langgraph) plus the v2-only deps that landed with the port
#             (mcp, openai, tiktoken).
# [tool.*]   : v10 quality gates (ruff, pyright, pytest+xdist) — these
#             are what scripts/local-ci.sh drives.
# [dependency-groups] dev: PEP 735 so a bare `uv sync` installs the dev
#             tools (v2 convention, keeps local-ci.sh unchanged).
# [build-system]: maturin builds the rust/agentalloy-core crate. The
#             Python layer does not import agentalloy._core yet — that
#             wiring lands in a later milestone; the crate must still
#             build as part of every package build.

[project]
name = "agentalloy"
version = "11.0.1"
description = "AgentAlloy — the Agent Operating System: a single, self-contained, stateless, multi-harness agent runtime (v10 runtime surface + v2 execution stack)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nate Meyers" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "duckdb>=1.5.4",
    "overgraph>=0.17.0",
    "tantivy>=0.26",
    "watchdog>=6.0.0",
    "tomli-w>=1.0",
    "tree-sitter==0.25.2",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-rust>=0.24.0",
    "toml>=0.10.2",
    "defusedxml>=0.7.1",
    "docstring-parser>=0.16",
    # Graph runner: the request path only touches langgraph when a
    # task is in an active phase.
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # v2 execution stack (ported 2026-09-12):
    "mcp>=1.24",
    "openai>=2.34",
    "tiktoken>=0.13",
]

[project.optional-dependencies]
# ONNX re-ranker — installed on demand by `agentalloy install --with rerank`.
rerank = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pyjwt>=2.12.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.9",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
# The installed CLI is the v10 product shell (wire/unwire/update/reset/...)
# running on the v2 execution layer — see the M0 merge (ac04873). The v2
# execution layer's own thin CLI (agentalloy.cli) stays importable for
# python -m agentalloy and tests/test_cli.py; it is not the product entry.
agentalloy = "agentalloy.install.__main__:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# The crate lives in a workspace (rust/Cargo.toml); point maturin at the
# member manifest directly or it parses the workspace root and fails.
manifest-path = "rust/agentalloy-core/Cargo.toml"
python-source = "src"
module-name = "agentalloy._core"
# The extension is only importable once cargo has built it with the
# pyo3 extension-module feature (see justfile `build`).
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    "skill-source/",
    "fixtures/",
    "agents/",
    "agency-agents/",
    "vercel-labs-agent-skills/",
    "agent-skills/",
    "spike/",
    "tasks/",
    "results/",
    "build/",
    # Vendored engine (see code_index/engine/VENDORED.md): keep
    # upstream's style to minimize the re-vendoring diff.
    "src/agentalloy/code_index/engine/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# N818 would force every typed exception name to end with "Error"; the LM
# client exception hierarchy uses "Unavailable"/"Timeout"/"BadResponse" names
# by design (mapped to specific HTTP response codes in the contract).
ignore = ["E501", "N818", "SIM117", "N806"]

[tool.ruff.lint.per-file-ignores]
# conftest sets sys.path (so tests can import the eval/ package under
# pytest --import-mode=importlib) before its own imports run — module-level
# imports after that setup are intentional, not E402 violations.
"tests/conftest.py" = ["E402"]
# Vendored engine (see src/agentalloy/code_index/engine/VENDORED.md): keep
# upstream's style to minimize the re-vendoring diff — relax the noisy
# style-only rules; E/F correctness rules still apply.
"src/agentalloy/code_index/engine/**" = ["SIM102", "SIM105", "SIM114", "SIM118", "B905", "N815", "N817"]
# F811 false positives: pytest fixture parameter names shadow the fixture_repo
# import from conftest (standard pytest re-export pattern).
"tests/api/test_state.py" = ["F811"]
"tests/signals/test_skill_loader.py" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Header/Body are the standard FastAPI default-argument idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src"]
# The retired authoring subpackage was removed (see agentalloy-authoring
# for corpus authoring); the semantic install-pack gate is its runtime
# successor. The vendored tree-sitter engine (see code_index/engine/VENDORED.md)
# keeps upstream's looser typing; only the facade boundary is strict-checked.
exclude = [
    "src/agentalloy/code_index/engine/**",
    "tests/**",
    # OverGraph GQL return types are not well-typed in the upstream library.
    # The code works correctly at runtime; pyright cannot infer the shapes.
    "src/agentalloy/code_index/store/overgraph_store.py",
    "src/agentalloy/storage/overgraph_skill_store.py",
]
stubPath = "src/agentalloy/stubs"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedFunction = false
reportPrivateUsage = "warning"
reportUnknownLambdaType = "warning"
# External data boundaries (upstream LLM/SSE chat-completion JSON, corpus
# import JSON, GQL query results) are typed as `dict[str, Any]` / `list[Any]`
# by design — the payload is genuinely arbitrary JSON being relayed or
# inspected, and `Any` is the honest value type for it. In strict mode pyright
# treats `Any` as "unknown", so these three rules fire on every downstream
# access to such data. They are relaxed here (not the rules that catch real
# mistakes): genuine type mismatches are still enforced by reportArgumentType,
# reportGeneralTypeIssues, reportOptionalMemberAccess, etc.
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportReturnType = "warning"
reportOperatorIssue = "warning"
reportOptionalMemberAccess = "warning"
reportUnnecessaryIsInstance = "warning"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -m 'not integration and not container and not harness_e2e' -n auto --dist loadgroup"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring a live LM Studio or other external service",
    "container: real-podman tests — slow and port-bound; excluded from the fast parallel default, run serially (`pytest -m container -n0`)",
    "harness_e2e: drives real harness binaries through a live proxy against a stub upstream; skips per-harness when the binary is absent (`pytest -m harness_e2e -n0`)",
    "xdist_group: pin a group of tests onto a single xdist worker (e.g. real :48950 binders)",
]
asyncio_mode = "auto"
