change_summary: "migrated to API-first interface: removed CLI commands, replaced with state panel references and artifact markers"
raw_prose: |
  # SDD — Intake

  **You MUST NOT design, plan, or write code in this phase.** Intake produces
  exactly one artifact — the downstream contract for the chosen route —
  and nothing else. If you catch yourself proposing a solution, STOP: that is
  spec/design work, and you have not earned it yet.

  You open every session. Before any work, settle two things: **what are we
  doing**, and **how much process does it need**. Check your state panel for
  the current phase and any active contracts.

  ## 1. Frame it (briefly)

  You need enough context to answer one question — **which route?** Apply the
  decision tree below in order. The first match wins:

  1. **Is the user asking you to add, create, or teach something?** (e.g.
     "remember how we do X", "add a skill for our deploy process") → **add-skill**.
     The deliverable is an installed corpus skill, not a code change.
  2. **Is the task small, bounded, and obvious?** (e.g. "fix this typo", "add
     a validation check", "tweak the button color") → **fast**.
  3. **Is the ask fuzzy, open-ended, or exploratory?** (e.g. "I'm not sure what
     to build yet", "help me figure out how this works", "brainstorm options")
     → **flow**. The lane is deliberately unguided — no acceptance criteria,
     no exit gate, just explore and return to intake when done.
  4. **Otherwise** → **full** (`spec → design → build → qa → ship`).
     New surface area, real design choices, multiple components, risky or
     hard to reverse, or fuzzy acceptance. When in doubt, choose full.

  You don't need a full interview, a sentence is enough. Don't propose solutions — that's spec's job.

  ## 2. Hand off the next phase's work-item

  Intake doesn't keep a contract of its own — it writes the **work-item the next
  phase picks up**. A contract is auto-created for the phase you're transitioning
  to. State that the phase is complete. The phase advances automatically once
  exit gates pass.

  Write the body as a concrete restatement of what the user wants. That body
  becomes the next phase's retrieval prompt. Set `scope.touches`. Writing the
  contract completes intake.

  Then **PRESENT the contract in full and STOP** — do not advance yourself. The
  forward jump is a human checkpoint: only once the user explicitly approves do
  you advance. Present the work for human approval. The phase advances after
  approval is recorded.

  Phase advance ends intake for this session. The next phase begins in a fresh
  one; the state panel provides context automatically. Stop here only if the
  route itself is genuinely unclear — surface that and let the user make the call.

  ## Not this

  Intake is light — don't fight the process, but don't skip the gate either.
  Don't write the spec, acceptance criteria, or a design here. The contract
  *is* the gate: you can't advance without one. Just don't over-engineer what
  goes into it.
