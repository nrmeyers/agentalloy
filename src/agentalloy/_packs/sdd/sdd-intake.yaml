skill_id: sdd-intake
canonical_name: SDD — Intake (sdd-intake)
description: "Open every session: check for work in progress, run a short intent interview, decide full SDD vs fast lane vs add-skill, and write a contract."
category: operational
skill_class: workflow
domain_tags:
  - spec-driven-development
  - intake
  - intent-interview
  - scoping
requires: []
always_apply: false
applies_to_phases:
  - intake
# Load-bearing advance commands — must be present for prose validation.
prose_invariants:
  - "agentalloy phase set spec"
  - "agentalloy phase set sdd-fast"
  - "agentalloy phase set add-skill"
exit_gates:
  # §3: intake must produce a contract for the next phase.
  contract_exists:
    phase: spec
signal_keywords:
  - scope is clear
  - ready to scope
  - start spec
  - begin work
  - next phase
contract_template: |
  ---
  phase: intake
  task_slug: {{task_slug}}
  route: {{route}}
  domain_tags: []
  scope:
    touches: []
    avoids: []
  success_criteria: []
  related_contracts: []
  created_at: {{created_at}}
  ---

  # {{task_slug}}

  ## What the user actually wants
  <one-paragraph restatement>

  ## Intent signals
  - intent: <new-build | change-existing | investigate | review | other>
  - artifact_type: <feature | fix | refactor | doc | spike | ...>
  - scope: <small | medium | large> — <what it touches / avoids>
  - urgency: <now | soon | someday>

  ## Proposed route
  <full SDD, sdd-fast, or add-skill, and why>

category_scope: [process]
author: agentalloy
change_summary: "decision tree for lane selection, present-and-stop hand-off, explicit phase validation via agentalloy phase get"
raw_prose: |
  # SDD — Intake

  **You MUST NOT design, plan, or write code in this phase.** Intake produces exactly one
  artifact — the contract created by `agentalloy contract init` — and nothing else. If you catch
  yourself proposing a solution, STOP: that is spec/design work, and you have not earned it yet.

  You open every session. Before any work, settle two things: **what are we
  doing**, and **how much process does it need**.

  ## 1. Frame it (briefly)

  You need enough context to answer one question — **which route?** Apply the
  decision tree below in order. The first match wins:

  1. **Is the user asking you to add, create, or teach something?** (e.g.
     "remember how we do X", "add a skill for our deploy process") → **add-skill**.
     The deliverable is an installed corpus skill, not a code change.
  2. **Is the task small, bounded, and obvious?** (e.g. "fix this typo", "add
     a validation check", "tweak the button color") → **fast**.
  3. **Otherwise** → **full** (`spec → design → build → qa → ship`).
     New surface area, real design choices, multiple components, risky or
     hard to reverse, or fuzzy acceptance. When in doubt, choose full.

  You don't need a full interview for the fast or add-skill lanes — a sentence
  is enough. For full SDD, ask only what you're missing: the *what*, the scope,
  and any constraints (deadline, stack, non-goals). Don't propose solutions —
  that's spec's job.

  ## 2. Hand off the next phase's work-item

  Intake doesn't keep a contract of its own — it writes the **work-item the next
  phase picks up**, into the contract store:

      agentalloy contract init --phase spec --slug <task-slug>       # full lane
      # or, for the fast lane:
      agentalloy contract init --phase sdd-fast --slug <task-slug>
      # or, for custom-skill authoring:
      agentalloy contract init --phase add-skill --slug <task-slug>

  Fill `domain_tags` with the work's *technology surface* (the concrete tech it
  touches — not process words like "spec" or "build") and write the body as a
  concrete restatement of what the user wants. That body becomes the next phase's
  retrieval prompt: on entry the proxy front-loads the skills matching it, so the
  next phase starts already primed. Set `scope.touches` too. Writing the contract
  completes intake.

  Then **PRESENT the contract in full and STOP** — do not advance yourself. The
  forward jump is a human checkpoint: only once the user explicitly approves do
  you advance, with the command matching the lane you picked in §2:

      agentalloy phase set spec        # full lane
      agentalloy phase set sdd-fast    # fast lane
      agentalloy phase set add-skill   # custom-skill authoring

  Phase advance ends this session; the next phase begins in a fresh one, and
  `agentalloy resume` rebuilds context. Stop here only if the route itself is
  genuinely unclear — surface that and let the user make the call.

  ## Not this

  Intake is light — don't fight the process, but don't skip the gate either.
  Don't write the spec, acceptance criteria, or a design here. The contract
  *is* the gate: you can't advance without one. Just don't over-engineer what
  goes into it.
