skill_id: sdd-deliver-and-ship
canonical_name: SDD — Deliver and Ship (sdd-ship)
description: "Deliver the QA-verified change: a pull request whose narrative traces the spec → design → qa chain, a persisted delivery record with a rollback path, and reversibility scaled to risk. Terminal phase."
category: operational
skill_class: workflow
domain_tags:
  - spec-driven-development
  - delivery
  - pull-request
  - release-notes
  - rollback
requires: []
always_apply: false
applies_to_phases:
  - ship
# Load-bearing command token not derivable from exit_gates: how the next cycle is
# started after shipping. A customization may reword the prose but must keep it
# verbatim.
prose_invariants:
  - "state panel"
  - "/state/artifact"
  - "agentalloy artifact put"
exit_gates:
  all_of:
    # The ship gate is a "real record" check: the ship artifact must exist with
    # substantive content (not an empty stub or whitespace-only file). The
    # exact section headings are a prose convention, not a gate contract — the
    # agent knows the format from the prose, and the gate just proves a real
    # record was written.
    - artifact_size_min:
        phase: ship
        name: "*.artifact"
        bytes: 50
signal_keywords:
  - ready to ship
  - ship it
  - shipped
  - deploy
contract_template: |
  ---
  phase: ship
  task_slug: {{task_slug}}
  route: full
  domain_tags: []
  scope:
    touches: []
    avoids: []
  success_criteria: []
  related_contracts: []
  created_at: {{created_at}}
  ---

  # {{task_slug}}

  ## Delivery

  Summary, PR link, and rollback plan live in the ship artifact.
# Workflow skills are selected by applies_to_phases (signal layer), not by
# phase_scope, so this is left empty and scoped via category instead.
phase_scope: []
category_scope: [process]
author: agentalloy
change_summary: "API-first migration: removed CLI commands (phase set, contract show, artifact-set, telemetry show, resume); replaced with state panel references, artifact markers, and agentalloy_query tool calls. Methodology unchanged — two-tier cascade: ship reads its incoming work-item from the contract store (qa authored, delivery skills front-loaded on entry); terminal phase, no further hand-off; keeps the proportionate delivery (ride the QA report → traceable PR narrative → ship artifact record with rollback → reversibility scaled to risk) and the user-confirmed reset to intake."
raw_prose: |
  # SDD — Ship (Deliver)

  **Checkpoint first.** You MUST confirm QA signed off (the qa artifact is green and the
  review clean) before shipping — if not, you skipped QA; STOP and go back. You MUST write
  the ship artifact with its **Summary** and **Rollback**, and you MUST ship only what QA
  approved — no last-minute changes that never went through the gate.

  QA signed off: the bar is green and the review is clean. Ship delivers that
  verified change — a pull request a human can review and trust, a record of
  what shipped, and a way back if it goes wrong. You're packaging work that's
  already proven, not re-proving it. This is the terminal phase.

  ## 1. Confirm you're shipping the verified state

  Check your state panel for the current phase and active contracts. Use
  `agentalloy_query` with action=`contract_detail` to read the work-item contract
  that qa authored — the proxy front-loaded the delivery skills for it on entry.
  Ship rides on QA's report (the qa artifact) — don't re-run the review. Just
  confirm the commit you're shipping *is* the reviewed one: the suite is green at
  HEAD and nothing landed after sign-off. If code changed since QA, it isn't
  verified — back to `qa`.

  ## 2. Write the PR narrative

  Open the PR with this repo's forge — the **VCS-forge** system skill names the
  CLI (`gh` / `glab`) and the branch/PR conventions. The description is the
  deliverable, not an afterthought:

  - **what** changed, in a sentence — the user-visible effect, not the file list.
  - **why** — the problem it solves; link the spec.
  - **how it was verified** — link the spec acceptance, the design, and the QA
    report so a reviewer can trace the chain instead of reconstructing it.

  Record the PR narrative by piping its body to the store:
  `agentalloy artifact put --phase deliver --slug <task-slug> --name pr-narrative`
  (content on stdin; PUT /state/artifact is the HTTP fallback):

  ```
  ...narrative content...
  ```

  A reviewer should be able to approve from the narrative plus the diff, without
  spelunking the history.

  ## 3. Record the delivery

  Write the ship artifact with `## Summary` (what shipped, the PR
  link, the release-notes or changelog entry) and `## Rollback` (how to reverse this
  exact change — the revert commit, the flag to flip, any data migration to undo)
  and record it: `agentalloy artifact put --phase deliver --slug <task-slug>
  --name delivery.artifact` (content on stdin; PUT /state/artifact is the HTTP
  fallback):

  ```
  ## Summary
  ...what shipped...
  ## Rollback
  ...how to reverse...
  ```

  The ship artifact lives in the store — no ``docs/ship/*.md``
  file. Update the changelog or release notes to the repo's own convention.

  ## 4. Reversibility scales with risk

  How this org ships and rolls back is the **deploy-target** system skill's call
  — read it. Its default is merge-is-release, reversible with a revert, and
  that's enough for most changes. When the change carries real production risk —
  a migration, a user-facing behavior change, anything hard to undo — follow the
  deploy skill's rollout (flag / staged %) and watch the health signals it names,
  rolling back the moment one trips. Don't build that apparatus for a change a
  plain revert already covers.

  ## 5. After it lands — automated watcher

  The watcher opens the PR, monitors CI, and detects merge — all automatically.
  After writing the PR narrative, the proxy starts the watcher for you. It:

  - Opens the PR with the narrative from the pr-narrative artifact
  - Polls CI every 60 seconds
  - Captures all CI results to telemetry (queryable via `agentalloy_query` with action=`telemetry`)
  - After 5 CI failures, pauses and notifies you
  - Detects when the PR merges (via VCS API)
  - After merge, asks you whether to reset to intake

  You do NOT need to run any watcher commands. The proxy handles everything.

  ## 6. Close it out

  Ship is terminal — unlike every other phase, it does **not** self-advance.
  Once the watcher confirms the merge and you've confirmed you're ready to reset
  to intake, the work is done: **stay in `ship`** and tell the user it shipped.
  Do not then go quiet and wait to be prompted — explicitly ask the user whether
  they're ready to reset to intake for the next work item. The one transition out
  is back to the top, and it's the user's call, not yours: when they say go,
  reset to intake via your state panel's reset action (POST /state/phase with
  JSON body `{"value": "intake"}`), and the next session opens fresh. Check your state panel for the
  current phase at any time. **Never reset on your own initiative** —
  a green CI run or a successful merge is not permission; only the user's explicit
  yes is. Ask, then wait for the answer.

  ## Not this

  Don't re-do QA's work — ship trusts the gate; reverifying everything is just
  churn. Don't ship a narrative-free PR ("updates", "fixes") — the *why* is the
  point. Don't ship without a way back; "we'll figure out rollback if we need
  it" is how incidents start. And don't gold-plate delivery — a feature flag and
  a staged rollout for a one-line copy fix is its own kind of waste.
