change_summary: "API-first migration: removed CLI command (phase set intake); replaced with state panel reference. Methodology unchanged — flow lane: deliberately unguided exploration (brainstorming, exploratory Q&A) with a return edge to intake; no exit gates, no acceptance criteria, no build loop. The prose says \"explore\" without emptying into \"do nothing.\""
raw_prose: |
  # SDD — Flow

  **This lane is for thinking, not doing.** The flow lane is your space to explore,
  question, brainstorm, and learn — without the pressure of producing something
  specific. There are no acceptance criteria here, no exit gate, no deadline.

  You do not need to design, plan, or code in this lane. You do not need to produce
  a contract, a spec, or a deliverable of any kind.

  ## What you can do

  Think freely. Query the codebase. Trace data flows. Read documentation. Write
  notes to yourself. Ask the user questions. Explore alternatives. Build mental
  models. Take apart assumptions. Map dependencies. Sketch ideas — not code, just
  ideas.

  There is no wrong move in this lane. The only rule is: **don't mistake exploration
  for production**. If you start building, you've left the lane.

  ## How this lane works

  1. **Start wherever you like.** You don't need a contract, checkpoint, or a
     pre-written task. Just begin.
  2. **Follow what interests you.** If you're tracing a feature's data flow, do that.
     If you're reading tests to understand how something works, do that. If you're
     sketching architecture in your notes, do that. There are no prescribed steps.
  3. **Notice what you learn.** As you explore, pay attention to what becomes clear,
     what gets murkier, and what questions keep coming up. These observations
     matter — they shape what comes next.
  4. **Return to intake.** When the exploration has run its course — when you've
     learned enough to have a clearer sense of direction, or when you simply want
     to pause — state that the phase is complete. The phase advances automatically
     once exit gates pass. Check your state panel for the current phase at any time.
     Intake will help you decide whether the exploration points toward the full
     SDD lane, the fast lane, or a fresh round of flow.

  ## This is not

  This lane is not a substitute for spec or design. If you find yourself defining
  acceptance criteria, writing a design document, or planning tasks, you've left
  the flow lane — go back.

  This lane is not a code-writing lane. No `src/`, no `tests/`, no artifact markers.
  The output of flow is clarity, not code.

  This lane is not a decision lane. You may surface options, compare approaches,
  or build a case — but you don't need to commit to anything. Decisions happen in
  spec and design. Flow is the space before commitment.

  ## Why this lane exists

  Some problems can't be solved by jumping straight into building. They need
  exploration first — a period of open-ended inquiry where the goal is understanding,
  not output. The flow lane makes that a first-class part of the lifecycle, instead
  of an untracked afterthought that the graph can never tell you is overdue.

  It is the lane you use when you're unsure what to do next, when the ask is fuzzy
  and you need to think before you scope, when you're investigating a bug but don't
  yet know what's broken, or when you simply want a space to think without the
  pressure of delivering something specific.
