skill_id: sdd-spec-and-scoping
canonical_name: SDD — Spec and Scoping (sdd-spec)
description: "Turn the intake contract's fuzzy ask into a spec design and build can't drift from: surface assumptions, reframe wants into checkable acceptance, and name explicit non-goals — recorded via the state panel artifact endpoint."
category: operational
skill_class: workflow
domain_tags:
  - spec-driven-development
  - scoping
  - acceptance-criteria
  - non-goals
  - user-intent
requires: []
always_apply: false
applies_to_phases:
  - spec
# Load-bearing references not derivable from exit_gates: the forward advance
# to design. A customization may reword the prose but must keep it verbatim.
prose_invariants:
  - "state panel"
  - "/state/artifact"
  - "agentalloy artifact put"
exit_gates:
  all_of:
    - artifact_exists:
        phase: spec
        name: spec.artifact
    - artifact_contains:
        phase: spec
        name: spec.artifact
        sections:
          - Acceptance Criteria
          - Out of Scope
    # Human-in-the-loop checkpoint (#10): spec→design requires a recorded
    # approval. `since_name_glob` = the spec artifact name so editing it after
    # approval invalidates the marker (current digest != recorded digest →
    # unapproved again). Human approval is recorded when the user approves.
    # The service gate (`gates.py::evaluate_phase_gate`) is the HARD
    # enforcement and runs even under `--force`; this exit_gate node is the
    # composed advisory that surfaces the awaiting-approval message in-proxy
    # BEFORE the user tries to advance. Matches the design node at
    # sdd-design-and-planning.yaml.
    - approval_recorded:
        since_name_glob: spec.artifact
signal_keywords:
  - done with spec
  - ready to design
  - acceptance is clear
  - next phase
contract_template: |
  ---
  phase: spec
  task_slug: {{task_slug}}
  route: full
  domain_tags: []
  scope:
    touches: []
    avoids: []
  success_criteria: []
  related_contracts: []
  created_at: {{created_at}}
  ---

  # {{task_slug}}

  ## Scope in a sentence

  <what this changes, and the boundary of "this">

  ## Spec

  Acceptance criteria and out-of-scope live in the spec artifact
  (recorded via `agentalloy artifact put` or PUT /state/artifact, name `spec.artifact`).
# Workflow skills are selected by applies_to_phases (signal layer), not by
# phase_scope, so this is left empty and scoped via category instead.
phase_scope: []
category_scope: [process]
author: agentalloy
change_summary: "migrated to API-first interface: removed CLI commands, replaced with state panel references and artifact markers; outcomes-first spec with code-index + knowledge-graph reconnaissance"
raw_prose: |
  # SDD — Spec

  **Before writing any spec**, check your state panel to verify intake's contract exists,
  and **before writing code**, verify the preceding phase's deliverables exist.

  **Checkpoint first.** You MUST confirm intake's contract exists. Use `agentalloy_query`
  with action=`contract_detail` to read the full contract. If it does not exist, you
  skipped intake; STOP and go back.

  You MUST record the spec by piping its body straight to the store:
  `agentalloy artifact put --phase spec --slug <task-slug> --name spec.artifact`
  (content on stdin; PUT /state/artifact is the HTTP fallback), carrying its
  **Acceptance Criteria** and **Out of Scope** sections. There is no file to write —
  this is a store write, not a filesystem document; a file on disk is not an artifact,
  and the artifact exists only once the recording succeeds. You MUST NOT design
  solutions or touch `src/` here — spec settles
  *what* and *done*, never *how*.

  You have one job: turn the intake contract's fuzzy ask into a spec precise enough that
  design and build can't drift from it. Bad specs cascade downstream into bad designs and
  bad code — this is where you stop them.

  ## 1. Ground your questions in the codebase

  Before you ask the user anything, understand what's possible in this codebase.
  Use `agentalloy_query` with action=`code_search` and action=`knowledge_related` to
  find answers about the existing codebase. These aren't design tools; they're
  reconnaissance tools. You're preparing to ask the user about outcomes, and you can't
  ask good questions if you don't understand the terrain.

  - **Code search**: What are the entry points? What patterns does this repo follow?
    What's the data flow? (e.g. "the app has a FastAPI entry at `/api/v1` with Pydantic
    models in `models/`")
  - **Knowledge graph**: What domain concepts exist? What are the relationships between
    entities? What constraints are baked in? (e.g. "User → Order → Payment with a status
    transition constraint")

  This is reconnaissance, not design. Query the code-index and knowledge graph to inform
  your questions — don't use them to make method decisions. If you don't have code-index
  or knowledge-graph tools available, skip reconnaissance and proceed from the intake
  contract.

  ## 2. Ask about outcomes — not methods

  The user's job is to say what they want. Your job is to understand and clarify.

  Ask about **outcomes** — what should *happen* when the work is done, not *how* it
  happens. The method is design's call.

  When the user describes their goal, decide what outcomes they need:

  - **One clear outcome?** Confirm it's specific enough to test.
  - **Multiple outcomes?** Present them as a numbered list and have the user prioritize.
  - **Two or more reasonable options?** Present both as options with a recommendation.

  When you present options, **always include your recommendation**. The user has context
  about their goals that you don't — but you have context about the codebase and
  trade-offs that they don't. Present the options, recommend, and let the user decide.

  Example:

      Option A: User authenticates via session cookies.
      Option B: User authenticates via OAuth (GitHub).
      Recommendation: A — simpler, and the user base doesn't currently need SSO.
      B can be added later if needed.

  The how — which pattern to follow, which library to use, how to structure the code —
  is design's job. Your job is to make sure the user knows what they're asking for.

  ## 3. Surface your assumptions

  Before writing acceptance criteria, list what you're assuming — the scope of "this,"
  the constraints you're working within, the things you're *guessing* about the context.
  Have the user correct them:

      Assuming: this changes the API only (not the UI), the data model stays the same,
      and we're targeting 4G connectivity.
      Correct me now, or I build on these.

  A silent assumption is the most expensive misunderstanding there is. The spec exists to
  surface them *before* code does.

  ## 4. Reframe into checkable acceptance

  Translate every outcome into a condition a test or a person can mark true/false:

      "make the dashboard faster"  →  LCP < 2.5s on 4G, data load < 500ms

  If you can't make a requirement checkable, it isn't a requirement yet — resolve it
  with the user, don't guess.

  ## 5. Name what you're NOT doing

  Write the non-goals down. An "Out of Scope" list is the cheapest scope control there
  is, and the first thing you point at when the work starts to sprawl.

  ## 6. Record it + prepare the hand-off

  The **spec artifact** is the deliverable and the single source of truth for acceptance —
  record it by piping the body to the store: `agentalloy artifact put --phase spec
  --slug <task-slug> --name spec.artifact` (content on stdin; PUT /state/artifact is
  the HTTP fallback).

  The body MUST include `## Acceptance Criteria` and `## Out of Scope` sections. That
  completes spec.

  Then **prepare the hand-off** to design. The advance call writes the design contract in
  the same request: fill `domain_tags` with the *design surface* (the tech and patterns
  design will reason about — `caching`, `async`, `postgres-schema`, not process words)
  and write the contract body as what design must produce for this feature. Set
  `scope.touches/avoids`. Don't copy acceptance into it — the spec artifact is
  acceptance's one home.

  Then **PRESENT the spec in full and STOP** — do not advance yourself. The forward jump
  to design is a human checkpoint: only once the user explicitly approves do you advance,
  via your state panel's advance action (POST /state/advance) with `"approved": true`.
  Phase advance ends this session; the next phase begins in a fresh one, and the state
  panel provides context automatically. If anything's still unresolved — an assumption
  the user hasn't confirmed, an acceptance criterion you can't make checkable — **stop
  and surface it** instead of advancing; resolve it first. The phase guard refuses the
  jump until the spec artifact is recorded with its required sections AND a human
  approval is recorded, so a premature advance just names what's missing, including a
  forgotten artifact or a missing section.

  ## Not this

  Don't design the solution here — no architecture, no file-by-file plan; that's design's
  job, and doing it now locks in choices you haven't earned. Don't pad the spec with
  boilerplate the repo already documents. Don't leave acceptance fuzzy to "figure out
  later" — later is more expensive. And if it now feels too small for the full lane,
  intake over-called it: state that the phase is complete and transition to the fast
  lane instead.
