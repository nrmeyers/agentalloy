skill_id: sdd-verify-and-review
canonical_name: SDD — Verify and Review (sdd-verify)
description: "The wide net before ship: run the full suite (integration included), lint, and typecheck; verify the change meets every spec acceptance and respects non-goals; review for correctness/security/readability/architecture/performance — recorded to the qa artifact."
category: operational
skill_class: workflow
domain_tags:
  - code-review
  - quality-gates
  - verification
  - security
  - regression
requires: []
always_apply: false
applies_to_phases:
  - qa
# Load-bearing tokens not derivable from a gate path. (1) The forward advance to
# ship. (2) the solutions artifact — the codify target: the lessons_recorded gate
# below resolves the slug internally and carries no `path` arg (so it emits no
# spurious advisory), which means the token is NOT auto-derived; asserting it
# here keeps prose and gate in lock-step, so a prose override that drops the
# "write the lesson" instruction is rejected at runtime (shipped prose served,
# warning logged) until its author re-adds the token. A customization may reword
# the prose but must keep both verbatim.
prose_invariants:
  - "state panel"
  - "/state/artifact"
  - "the solutions artifact"
exit_gates:
  all_of:
    # The QA gate is a "real record" check: the qa artifact must exist with
    # substantive content (not an empty stub or whitespace-only file). The
    # exact section headings are a prose convention, not a gate contract — the
    # agent knows the format from the prose, and the gate just proves a real
    # record was written.
    - artifact_size_min:
        phase: qa
        name: "*.artifact"
        bytes: 50
    # Compound-engineering codify gate: blocks qa->ship until THIS task's lesson
    # is recorded in the solutions artifact (store: phase=qa, name=solution;
    # a pre-migration docs/solutions/<slug>.md file still satisfies it).
    # Slug-scoped (eval_lessons_recorded resolves the active work-item), so a
    # stale prior-task lesson can't satisfy it; deterministic, so it blocks under
    # the CLI's lm_client=None forward gate. `phase: qa` pins the work-item.
    - lessons_recorded:
        phase: qa
signal_keywords:
  - done with qa
  - review clean
  - ready to ship
  - next phase
contract_template: |
  ---
  phase: qa
  task_slug: {{task_slug}}
  route: full
  domain_tags: []
  scope:
    touches: []
    avoids: []
  success_criteria: []
  related_contracts: []
  created_at: {{created_at}}
  ---

  # {{task_slug}}

  ## QA scope

  <what needs verification — the change under review>

  ## Report

  Checks + review verdict live in the qa artifact.
# Workflow skills are selected by applies_to_phases (signal layer), not by
# phase_scope, so this is left empty and scoped via category instead.
phase_scope: []
category_scope: [process]
author: agentalloy
change_summary: "API-first migration: removed all CLI commands (agentalloy phase set, agentalloy contract show, agentalloy contract artifact-set, agentalloy lessons promote, agentalloy resume). Replaced with state panel references, artifact markers, and agentalloy_query tool calls. QA now reads contracts via agentalloy_query with action=contract_detail, records artifacts via <!-- agentalloy:artifact --> markers, and advances phases automatically when exit gates pass. The solutions artifact is recorded via artifact marker instead of CLI. Route-by-cause remediation and compound-engineering codify gate unchanged."
raw_prose: |

  **Before writing any code, verify the preceding phase's deliverables exist**
  (`src/**`, `docs/plan/*.md`).  # SDD — QA (Verify and Review)

  **Checkpoint first.** You MUST confirm the implementation (`src/`) and its tests (`tests/`) exist
  before reviewing — if they do not, you skipped build; STOP and go back. You MUST record the gate
  results in the qa artifact (**Checks** + **Review**), and you MUST codify what this task
  taught you to the solutions artifact before advancing to ship. You MUST NOT add features or
  new scope here — QA verifies, it does not build.

  Build proved each task green against its designed cases. QA is the wider net:
  the whole change at once, not one task at a time — does it actually do what
  spec promised, does the *full* suite pass, and does it clear the bar a human
  would block a merge on? This is the last gate before ship.

  ## 1. Run the full bar

  Read your work-item contract first — use `agentalloy_query` with action=`contract_detail` to read the full contract, which
  build authored — the proxy front-loaded the verification skills for it on
  entry. Then run everything — the **CI** system skill names the exact commands
  — and record the real results, not "should pass":

  - the **whole** test suite, integration included (build only proved the units)
  - the linter — clean
  - the type checker — clean

  A red anything stops here: fix it (route back to **build** if it's a code
  defect) before you review. Green is the floor, not the
  finish line.

  ## 2. Check it against spec and design

  Open the spec artifact and the design artifact. Verify:

  - **every acceptance criterion is met** — each AC-N has a test proving it, and
    the behavior is real, not faked to satisfy a test.
  - **it's wired** — trace each feature from the app's real entry point and
    confirm the data actually flows; a built-but-unwired feature is incomplete,
    not partial credit.
  - **non-goals were respected** — nothing on the Out of Scope list got built.
  - **no drift** — the implementation matches the design's approach, or the
    divergence is deliberate and noted, not an accident.

  ## 3. Review the change

  Read the diff across these axes; flag what you find, labelled by severity
  (**Critical** blocks merge; plain = required before ship; **Nit/Optional** =
  the author's call):

  - **Correctness** — edge cases, error paths, off-by-ones, races, the same
    fact defined in two places (duplicated state drifts; it should be one
    named constant, derived everywhere else).
  - **Tests** — do they assert exact semantic results on pinned inputs, or
    just existence/counts that stay green on broken code?
  - **Security** — input validated, secrets out of code, authz checked, queries
    parameterized, external data treated as untrusted.
  - **Readability** — clear names, straight control flow, no clever tricks, no
    abstraction that hasn't earned its keep.
  - **Architecture** — fits existing patterns, clean boundaries, no needless
    duplication.
  - **Performance** — no N+1s, unbounded fetches, or hot-path waste.

  Then sweep for dead code the change orphaned — list it, and ask before
  deleting anything you didn't add.

  ## 4. Record the verdict to the qa artifact

  The qa exit gate is store-backed. You MUST record the verdict via your state
  panel's record_artifact action (PUT /state/artifact), naming it `qa.artifact`,
  body shaped:

  ```
  # <slug>

  ## Checks

  <suite, lint, and type results — green bar>

  ## Review

  <findings labelled by severity + the spec/non-goals/drift verdict>

  ## Routed Findings

  <when findings route back to an earlier phase, list each one here as a
  structured entry so the receiving phase can act on it without re-deriving.
  Omit this section on a clean report. Format:>

  ### <short title>
  - route: <build|design|spec>
  - severity: <Critical|required>
  - description: <what's wrong and what the receiving phase should do>
  ```

  A clean report — green bar,
  every AC met, no open Critical or required finding — clears the way to ship.
  A report with routed findings does not advance to ship — the findings are
  the worklist for the phase that owns the fix.

  On a clean report, seed **ship's work-item** before you go — record it via
  PUT /state/artifact, name `work-item`:

  ```
  <delivery surface: release, changelog, migration, rollout — whatever shipping this touches.
  Write it as what to ship and how to make it reversible.>
  ```

  That body is ship's retrieval prompt, so
  delivery opens already primed.

  ## 5. Codify what you learned

  **This is mandatory, not optional.** The phase guard blocks `ship` until this
  step completes. Write the solutions artifact — the compounding step: the problem
  you solved, the approach that worked, what you tried that *didn't*, and any
  decision worth keeping. Keep it concrete and short — a real lesson, not a
  restatement of the diff — so the next task starts smarter instead of from zero.

  Record it via your state panel's record_artifact action (PUT /state/artifact),
  name `solution`:

  ```
  <the problem, the approach that worked, what didn't, and the decision worth keeping>
  ```

  The name is `solution` with no `.artifact` — the qa artifact gate globs `*.artifact` and
  would otherwise demand `## Checks`/`## Review` of your lesson too.

  Check your state panel for recorded artifacts to confirm the lesson was captured.

  ## 6. Advance to ship

  Advance via your state panel's advance action (POST /state/advance).
  Go straight into delivery.
  Phase advance ends this session; the next phase begins in a fresh one, and
  the state panel provides context automatically. Don't wait to be told; a clean report
  *is* the signal. The phase guard refuses
  the jump until the qa artifact exists with its `## Checks` and `## Review`
  sections **and** the solutions artifact records this task's lesson, so a
  premature advance just names what's missing.

  Anything open routes by *cause*, and you don't fix code here: the report is
  the worklist for the phase that does. Don't advance to ship with an open
  Critical or required finding — route it back instead. Populate the
  **Routed Findings** section of the qa artifact with one entry per finding,
  each tagged with its route target (`build`, `design`, or `spec`), so the
  receiving phase's state leg carries the worklist forward without
  re-derivation.

  - **code defect** → route to build; build reproduces it as a failing test
    first, so the bug earns a regression test on the way out.
  - **design flaw** (the approach is wrong, not just the code) → route to
    design.
  - **spec gap** (an acceptance criterion was wrong or missing) → route to
    spec.
  - **nit / optional** → fix in place; it's not a blocker and doesn't need a
    test of its own.

  The change comes back through QA once the fix lands. There's no iteration cap
  — re-review until the report is clean.

  ## Not this

  Don't rubber-stamp — "tests pass" is necessary, not sufficient; the review is
  the point. Don't treat every nit as a blocker (you'll never ship) or wave
  through a Critical (you'll ship the bug). Don't re-review the unit behaviors
  design already specified — QA is about the whole: the integration, the
  regressions, the human-judgment axes. And don't fix a real defect in place:
  QA reviews, it doesn't write `src/` — a fix made here skips the red test and
  ships uncovered. Route it back instead.
