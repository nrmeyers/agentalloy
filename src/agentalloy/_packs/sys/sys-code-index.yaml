raw_prose: |
  # Code index

  This repo has a local code index (symbol graph + semantic search). Ground
  yourself in the actual codebase before guessing.

  - **design** — check blast radius before committing to an approach:
    `agentalloy code callers <fqn>` · `agentalloy code search "<topic>"`
  - **build** — fetch the symbols your task touches before writing:
    `agentalloy code bundle "<task description>"`
  - **qa** — regression scope of what you changed:
    `agentalloy code callers <changed-fqn> --depth 3`

  Results include file:line — read those files rather than re-searching.

  - **knowledge-graph** — find the design decisions behind a symbol:
    `agentalloy knowledge why <fqn>` · `agentalloy knowledge related "<query>"`

    The knowledge-graph is a decision layer riding on the code-index graph.
    It surfaces the rationale behind why code was written a certain way. Use
    it when you're modifying code and want to understand the original design
    intent, when you need to trace which decisions govern a particular symbol,
    or when you're researching related decisions about a topic.
