skill_id: vitest-mocking-and-timers
canonical_name: Vitest — Mocking, Spies & Fake Timers
description: 'Isolate code under test with Vitest''s vi utilities: mock modules with vi.mock, stub functions with vi.fn/vi.spyOn, control time with fake timers, and restore mocks between tests.'
category: engineering
